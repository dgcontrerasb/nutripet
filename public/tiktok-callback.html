<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NutriPet TikTok Callback</title>
  <style>
    body {
      margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #faf8f5; color: #1c1917; display: grid; place-items: center; min-height: 100vh; padding: 20px;
    }
    .card {
      max-width: 520px; width: 100%; background: #fff; border: 1px solid #e7e5e4;
      border-radius: 16px; padding: 28px; text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: 1.25rem; color: #143826; }
    p { color: #57534e; font-size: 0.95rem; }
    .btn {
      display: inline-block; margin-top: 14px; padding: 10px 18px; border-radius: 10px;
      background: #143826; color: #fff; text-decoration: none; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>NutriPet OTB &middot; Conectando con panel local...</h1>
    <p id="msg">Redirigiendo autorización de TikTok hacia tu servidor local (<code>http://localhost:8888/callback</code>).</p>
    <a id="fallback" class="btn" href="#">Continuar al panel local</a>
  </div>
  <script>
    const target = 'http://localhost:8888/callback' + window.location.search;
    document.getElementById('fallback').href = target;
    window.location.replace(target);
  </script>
</body>
</html>
